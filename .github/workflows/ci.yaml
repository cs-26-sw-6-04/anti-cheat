name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-flight runs for the same branch on new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.build_type }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-25.10]
        preset: [conan-debug, conan-release]
        include:
          - preset: conan-debug
            build_type: Debug
          - preset: conan-release
            build_type: Release

    # System dependencies (apt packages, bpftool, kernel BPF LSM) are
    # provisioned on the self-hosted runner VM out-of-band. See docs/ci.md.
    steps:
      - uses: actions/checkout@v4

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: .conan2
          key: conan-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('conanfile.py', '.mise.toml') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.build_type }}-

      - name: Configure
        run: |
          mise exec -- conan profile detect --force
          mise exec -- conan install . -s build_type=${{ matrix.build_type }} --build=missing
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: sudo ctest --preset ${{ matrix.preset }} --output-on-failure
