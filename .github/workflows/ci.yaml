name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-flight runs for the same branch on new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: true

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            cmake \
            pkg-config \
            libelf-dev \
            zlib1g-dev

      - name: Install bpftool
        env:
          BPFTOOL_VERSION: v7.6.0
        run: |
          curl -fsSL \
            "https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/bpftool-${BPFTOOL_VERSION}-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/bpftool
          which bpftool
          bpftool version

      - name: Configure
        run: |
          mise x -- conan profile detect --force
          mise x -- conan install . -s build_type=Release --build=missing
          cmake --preset conan-release

      - name: Build
        run: cmake --build --preset conan-release --parallel

      - name: Run test suite
        run: ctest --preset conan-release

      - name: Run live BPF integration tests
        run: sudo ctest --preset conan-release --output-on-failure
